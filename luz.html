<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eres la luz de mi vida</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: linear-gradient(#05070f 0%, #0b1026 38%, #1b1440 70%, #2e1c46 100%);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  svg { display: block; shape-rendering: crispEdges; }

  /* ---------- Cielo ---------- */
  #cielo { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .estrella {
    position: absolute;
    background: #fff;
    animation: titila ease-in-out infinite;
  }
  @keyframes titila { 0%,100% { opacity: .22; } 50% { opacity: 1; } }

  .luna {
    position: absolute; z-index: 1;
    top: 8%; left: 10%;
    width: 58px;
    filter: drop-shadow(0 0 22px rgba(215,225,255,.45));
    animation: respira 6s ease-in-out infinite;
  }
  @keyframes respira { 50% { transform: scale(1.05); } }

  /* ---------- Luciernagas ---------- */
  #luces { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  .luci {
    position: absolute;
    width: 4px; height: 4px;
    background: #f2ff9e;
    box-shadow: 0 0 6px 2px rgba(214,255,120,.75), 0 0 16px 6px rgba(160,220,80,.30);
    animation: vuela ease-in-out infinite alternate, parpadea ease-in-out infinite;
  }
  @keyframes vuela {
    from { transform: translate(0, 0); }
    to   { transform: translate(var(--dx), var(--dy)); }
  }
  @keyframes parpadea { 0%,100% { opacity: .10; } 45% { opacity: 1; } 60% { opacity: .55; } }

  /* ---------- Suelo nocturno ---------- */
  .suelo {
    position: absolute; z-index: 2;
    bottom: 0; left: 0;
    width: 100%; height: 92px;
    background-repeat: repeat-x;
    background-size: 46px 92px;
  }
  .arbol {
    position: absolute; z-index: 2;
    bottom: 66px;
    opacity: .92;
    transform-origin: bottom center;
    animation: mece 6s ease-in-out infinite;
  }
  @keyframes mece { 0%,100% { rotate: -2.5deg; } 50% { rotate: 2.5deg; } }

  /* ---------- Escenario ---------- */
  .stage {
    position: relative; z-index: 5;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px;
    padding-bottom: 86px;
  }

  /* ---------- Retrato ---------- */
  /* Sin marco: los ojos flotan en la noche y la piel se disuelve en el aire. */
  #retrato {
    position: relative;
    width: min(80%, 500px);
    aspect-ratio: 170 / 84;
    filter: drop-shadow(0 0 34px rgba(255,214,140,.22));
    animation: flota 5s ease-in-out infinite;
  }
  @keyframes flota { 50% { transform: translateY(-10px); } }
  #retrato canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    transition: opacity .06s steps(1);
  }
  #cerrados { opacity: 0; }
  #retrato.parpadeo #abiertos { opacity: 0; }
  #retrato.parpadeo #cerrados { opacity: 1; }
  /* Los reflejos van encima de todo y se apagan al parpadear. */
  #reflejos { pointer-events: none; }
  #retrato.parpadeo #reflejos { opacity: 0; }

  /* ---------- La cancion, debajo de los ojos ---------- */
  :root { --alto-texto: 24px; --alto-linea: 42px; }

  /* La pareja, chiquita, bailando junta sobre el pasto. */
  #pareja {
    --anchoB: clamp(30px, 6vw, 50px);
    position: absolute; z-index: 3;
    bottom: 70px; left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: flex-end;
    filter: drop-shadow(0 0 10px rgba(200,215,255,.18));
  }
  .bailarin {
    width: var(--anchoB);
    aspect-ratio: 26 / 36;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    image-rendering: pixelated;
    transform-origin: bottom center;
    animation: baila 1.6s ease-in-out infinite;
  }
  /* El espejo va en `scale`, aparte de la animacion: asi la chica queda
     volteada aunque el balanceo no corra. Se enciman un poco para que las
     manos de adentro se junten. */
  #chica { scale: -1 1; margin-left: calc(var(--anchoB) * -.155); }
  @keyframes baila {
    0%, 100% { rotate: -2.5deg; translate: 0 0; }
    50%      { rotate: 2.5deg;  translate: 0 -2px; }
  }

  #ventana {
    position: relative;
    width: 100%;
    height: calc(var(--alto-linea) * 3);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
            mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
  }
  #letra {
    position: absolute; left: 0; right: 0;
    top: var(--alto-linea);
    transition: transform .6s cubic-bezier(.25,.9,.3,1);
  }
  .linea {
    position: relative;
    height: var(--alto-linea);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity .5s, filter .5s;
    filter: blur(.6px);
  }
  .linea.activa { filter: none; animation: respira 2.6s ease-in-out infinite; }
  @keyframes respira { 50% { transform: scale(1.05); } }
  /* El par toma el ancho del texto: es lo que hace que la capa encendida
     caiga justo encima de la apagada. */
  .linea .par { position: relative; height: var(--alto-texto); }
  .linea .capa { height: 100%; }
  .linea .capa svg { height: 100%; width: auto; }
  /* La capa encendida se recorta de izquierda a derecha, como si la cantaran. */
  .linea .encendida {
    position: absolute; left: 0; top: 0;
    clip-path: inset(0 100% 0 0);
  }
  .linea.activa .encendida { filter: drop-shadow(0 0 10px rgba(255,214,140,.55)); }

  /* ---------- Enlace y pie ---------- */
  #volver {
    position: fixed; z-index: 10;
    top: 14px; right: 14px;
    padding: 8px 13px;
    border: 3px solid;
    background: #6b4a24;
    border-color: #a87c44 #33210f #33210f #a87c44;
    box-shadow: 0 3px 0 rgba(0,0,0,.45);
    cursor: pointer;
  }
  #volver svg { width: 72px; }
  #volver:hover { filter: brightness(1.2); }

  #pie { position: fixed; bottom: 9px; width: 100%; text-align: center; z-index: 10; opacity: .75; }
  #pie svg { width: 72%; max-width: 290px; margin: 0 auto; }

  /* ---------- Efectos ---------- */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  .chispa {
    position: absolute; width: 5px; height: 5px;
    background: #f2ff9e;
    box-shadow: 0 0 8px 3px rgba(214,255,120,.7);
    animation: sube 2.4s ease-out forwards;
  }
  @keyframes sube {
    from { transform: translate(0, 0) scale(.4); opacity: 1; }
    to   { transform: translate(var(--dx), -220px) scale(1.1); opacity: 0; }
  }
</style>
</head>
<body>
  <div id="cielo"></div>
  <div class="luna"></div>
  <div class="suelo" id="suelo"></div>
  <div id="luces"></div>

  <div class="stage">
    <div id="retrato">
      <canvas id="abiertos" width="170" height="84"></canvas>
      <canvas id="cerrados" width="170" height="84"></canvas>
      <canvas id="reflejos" width="170" height="84"></canvas>
    </div>

    <div id="ventana"><div id="letra"></div></div>
  </div>

  <div id="pareja">
    <div class="bailarin" id="chico"></div>
    <div class="bailarin" id="chica"></div>
  </div>

  <div id="fx"></div>
  <button id="volver"></button>
  <div id="pie"></div>

<script>
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
// Ojo: hay que redondear. Con coordenadas decimales el modulo daba un indice
// fraccionario y devolvia undefined, dejando zonas enteras sin pintar.
const pick = (arr, x, y) => {
  const h = Math.abs(Math.sin(Math.floor(x) * 12.9898 + Math.floor(y) * 78.233) * 43758.5453);
  return arr[Math.floor((h % 1) * arr.length)];
};

/* ==========================================================
   1. Tipografia pixelada (estilo Minecraft)
   ----------------------------------------------------------
   Cada letra mide 5x7. Encima se reservan 2 filas para los
   acentos y abajo 1 para la sombra: la caja completa es 5x10.
   ========================================================== */
const AVANCE = 6, ALTO_ACENTO = 2, CAJA = 10;

const FONT = {
  A:"01110,10001,10001,11111,10001,10001,10001", B:"11110,10001,10001,11110,10001,10001,11110",
  C:"01111,10000,10000,10000,10000,10000,01111", D:"11110,10001,10001,10001,10001,10001,11110",
  E:"11111,10000,10000,11110,10000,10000,11111", F:"11111,10000,10000,11110,10000,10000,10000",
  G:"01110,10001,10000,10111,10001,10001,01110", H:"10001,10001,10001,11111,10001,10001,10001",
  I:"11111,00100,00100,00100,00100,00100,11111", J:"00111,00010,00010,00010,00010,10010,01100",
  K:"10001,10010,10100,11000,10100,10010,10001", L:"10000,10000,10000,10000,10000,10000,11111",
  M:"10001,11011,10101,10101,10001,10001,10001", N:"10001,11001,10101,10101,10011,10001,10001",
  O:"01110,10001,10001,10001,10001,10001,01110", P:"11110,10001,10001,11110,10000,10000,10000",
  Q:"01110,10001,10001,10001,10101,10010,01101", R:"11110,10001,10001,11110,10100,10010,10001",
  S:"01111,10000,10000,01110,00001,00001,11110", T:"11111,00100,00100,00100,00100,00100,00100",
  U:"10001,10001,10001,10001,10001,10001,01110", V:"10001,10001,10001,10001,10001,01010,00100",
  W:"10001,10001,10001,10101,10101,11011,10001", X:"10001,10001,01010,00100,01010,10001,10001",
  Y:"10001,10001,01010,00100,00100,00100,00100", Z:"11111,00001,00010,00100,01000,10000,11111",
  "0":"01110,10001,10011,10101,11001,10001,01110", "1":"00100,01100,00100,00100,00100,00100,01110",
  "2":"01110,10001,00001,00010,00100,01000,11111", "3":"11111,00010,00100,00010,00001,10001,01110",
  "4":"00010,00110,01010,10010,11111,00010,00010", "5":"11111,10000,11110,00001,00001,10001,01110",
  "6":"00110,01000,10000,11110,10001,10001,01110", "7":"11111,00001,00010,00100,01000,01000,01000",
  "8":"01110,10001,10001,01110,10001,10001,01110", "9":"01110,10001,10001,01111,00001,00010,01100",

  "!":"00100,00100,00100,00100,00100,00000,00100", "?":"01110,10001,00001,00110,00100,00000,00100",
  "¡":"00100,00000,00100,00100,00100,00100,00100",
  "¿":"00100,00000,00100,01100,10000,10001,01110",
  ".":"00000,00000,00000,00000,00000,00000,00100", ",":"00000,00000,00000,00000,00110,00100,01000",
  ":":"00000,00100,00000,00000,00000,00100,00000", ";":"00000,00100,00000,00000,00100,00100,01000",
  "-":"00000,00000,00000,01110,00000,00000,00000", "_":"00000,00000,00000,00000,00000,00000,11111",
  "'":"00100,00100,00000,00000,00000,00000,00000", '"':"01010,01010,00000,00000,00000,00000,00000",
  "(":"00010,00100,01000,01000,01000,00100,00010", ")":"01000,00100,00010,00010,00010,00100,01000",
  "/":"00001,00010,00010,00100,01000,01000,10000", "+":"00000,00100,00100,11111,00100,00100,00000",
  "<":"00010,00100,01000,10000,01000,00100,00010", ">":"01000,00100,00010,00001,00010,00100,01000",
  "&":"01100,10010,10100,01000,10101,10010,01101",
  "♥":"01010,11111,11111,11111,01110,00100,00000",
  " ":"00000,00000,00000,00000,00000,00000,00000"
};

// Los acentos se dibujan en las dos filas de arriba, sobre la letra base.
const MARCAS = {
  agudo:    "00010,00100",
  grave:    "01000,00100",
  dieresis: "00000,01010",
  tilde:    "01101,10110",
  gorro:    "00100,01010"
};
const ACENTUADAS = {
  "Á":["A","agudo"],    "É":["E","agudo"],    "Í":["I","agudo"],
  "Ó":["O","agudo"],    "Ú":["U","agudo"],
  "À":["A","grave"],    "È":["E","grave"],    "Ì":["I","grave"],
  "Ò":["O","grave"],    "Ù":["U","grave"],
  "Ä":["A","dieresis"], "Ë":["E","dieresis"], "Ï":["I","dieresis"],
  "Ö":["O","dieresis"], "Ü":["U","dieresis"],
  "Â":["A","gorro"],    "Ê":["E","gorro"],    "Î":["I","gorro"],
  "Ô":["O","gorro"],    "Û":["U","gorro"],
  "Ñ":["N","tilde"],    "Ã":["A","tilde"],    "Õ":["O","tilde"]
};

// Que letra y que acento le toca a cada caracter. Si llega uno que no
// conocemos, se le quita el acento y se usa la letra pelona.
function glifo(ch) {
  if (FONT[ch]) return { base: ch, marca: null };
  if (ACENTUADAS[ch]) return { base: ACENTUADAS[ch][0], marca: ACENTUADAS[ch][1] };
  const pelado = [...ch.normalize('NFD')]
    .filter(c => c.charCodeAt(0) < 0x300 || c.charCodeAt(0) > 0x36f)
    .join('');
  return { base: FONT[pelado] ? pelado : ' ', marca: null };
}

// El texto de Minecraft lleva una sombra dura desplazada un pixel.
function pixelText(text, color, shadow = '#2a1608') {
  const chars = [...text.toUpperCase()];
  let main = '', shad = '';
  const punto = (px, py) => {
    shad += `<rect x="${px + 1}" y="${py + 1}" width="1" height="1" fill="${shadow}"/>`;
    main += `<rect x="${px}" y="${py}" width="1" height="1" fill="${color}"/>`;
  };

  chars.forEach((ch, i) => {
    const { base, marca } = glifo(ch);
    const x0 = i * AVANCE;
    FONT[base].split(',').forEach((fila, y) => {
      [...fila].forEach((bit, x) => { if (bit === '1') punto(x0 + x, y + ALTO_ACENTO); });
    });
    if (marca) MARCAS[marca].split(',').forEach((fila, y) => {
      [...fila].forEach((bit, x) => { if (bit === '1') punto(x0 + x, y); });
    });
  });

  return `<svg xmlns="http://www.w3.org/2000/svg" `
       + `viewBox="0 0 ${Math.max(1, chars.length * AVANCE)} ${CAJA}" `
       + `preserveAspectRatio="xMidYMid meet">${shad}${main}</svg>`;
}

/* ==========================================================
   LA LETRA
   ----------------------------------------------------------
   Cada renglon es { t: texto, d: cuantos segundos dura }.
   Para poner otra letra se cambia nada mas este arreglo: el
   tamano, el centrado y los tiempos se acomodan solos.
   Un renglon vacio sirve de respiro entre estrofas.
   Se pueden usar acentos, ñ, ¿ ¡, numeros y signos.
   ========================================================== */
const LETRA = [
  { t: 'FANISITA',             d: 3.0 },
  { t: 'DESDE QUE TE VI',      d: 3.2 },
  { t: 'SE ME OLVIDA TODO',    d: 3.4 },
  { t: 'MENOS TU NOMBRE',      d: 3.6 },
  { t: '',                     d: 1.2 },
  { t: 'ERES LA LUZ',          d: 3.0 },
  { t: 'DE MI VIDA',           d: 3.4 },
  { t: '',                     d: 1.2 },
  { t: 'TUS OJOS ME ALUMBRAN', d: 3.8 },
  { t: 'CUANDO TODO ESTÁ',     d: 3.0 },
  { t: 'OSCURO',               d: 2.6 },
  { t: 'NO SÉ CÓMO LE HACES',  d: 3.6 },
  { t: 'PERO ME HACES BIEN',   d: 3.6 },
  { t: '',                     d: 1.2 },
  { t: 'SI ME PREGUNTAN',      d: 3.2 },
  { t: 'QUÉ ES LA FELICIDAD',  d: 3.6 },
  { t: 'DIGO TU NOMBRE',       d: 3.0 },
  { t: 'Y YA',                 d: 2.4 },
  { t: '',                     d: 1.4 },
  { t: 'TE AMO FANISITA',      d: 5.0 }
];

/* ==========================================================
   2. Retrato pixelado: los ojos entre los dedos
   ========================================================== */
// Piel de noche: mas apagada y calida, como alumbrada por las luciernagas.
const PIEL_LUZ    = ['#d3a68d', '#c99b81', '#dcb096', '#c09277'];
const PIEL_MEDIA  = ['#b98a72', '#ad7f68', '#c2937a', '#a3765f'];
const PIEL_SOMBRA = ['#8a6150', '#7e5747', '#946a58', '#734f40'];
const PIEL_HONDA  = ['#57392e', '#4d3228', '#603f33'];
const CEJA        = ['#2e1c14', '#241510', '#38241a'];
const PESTANA     = ['#1c110c', '#140b08', '#26160f'];
// Rampa elegida a mano: el pixel art se ve limpio cuando cada tono describe un
// volumen. Estos seis van de la sombra al brillo y se usan a proposito.
const IRIS_RAMPA   = ['#2a190d', '#40270f', '#5c3a1a', '#7a4f27', '#986a38', '#b9884c'];
const IRIS_ANILLO  = '#1c1108';     // anillo limbal, el borde oscuro del iris
const PUPILA_HONDA = '#0c0704';
const ESCLERA_BASE = '#e7d9d0';
const ESCLERA_SOMB = '#c0a396';     // sombra que proyecta el parpado de arriba
const ESCLERA_HOND = '#9d8175';
const ESCLERA_CALI = '#dfb6a6';     // rincones, mas rosados
const LINEA_AGUA   = '#e3cfc2';
const REBOTE       = '#e8d9c8';
const SOMBRA_OJOS  = ['#8f5a52', '#7f4d46', '#9c675e', '#734339'];   // sombra rosada
const LAGRIMAL     = '#f7e4d8';                                      // brillo del lagrimal

const TILT = .13;   // esquina de afuera levantada: mirada de gata

const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// Altura del borde de la almendra en una columna: sirve para saber que tan
// hondo queda cada pixel bajo el parpado.
const bordeY = (dx, a, b, arriba) => {
  const k = Math.max(0, 1 - Math.pow(Math.min(1, Math.abs(dx / a)), 1.5));
  const d = b * Math.pow(k, 1 / 1.5);
  return arriba ? -d : d;
};

const W = 170, H = 84;

function nuevoLienzo() {
  return { px: new Array(W * H).fill(null) };
}
const set = (L, x, y, c) => {
  x = Math.round(x); y = Math.round(y);
  if (x >= 0 && x < W && y >= 0 && y < H && c) L.px[y * W + x] = c;
};

// Difuminado ordenado: en vez de un borde duro, la piel se deshace en pixeles sueltos.
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

// Mancha de piel alrededor de un ojo, que se disuelve hacia la oscuridad.
function parche(L, cx, cy, rx, ry) {
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++)
    for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
      const t = Math.hypot((x - cx) / rx, (y - cy) / ry);
      if (t > 1) continue;
      const desvanece = Math.max(0, (t - .45) / .55);
      const umbral = (BAYER[((y % 4) + 4) % 4][((x % 4) + 4) % 4] + .5) / 16;
      if (desvanece > umbral) continue;
      // Mas oscuro arriba (el hueco de la cuenca) y mas claro en el pomulo.
      const tono = y < cy - ry * .45 ? PIEL_HONDA
                 : y < cy - ry * .12 ? PIEL_SOMBRA
                 : y > cy + ry * .35 ? PIEL_LUZ
                 : PIEL_MEDIA;
      set(L, x, y, pick(tono, x, y));
    }
}

// Ceja arqueada: gruesa en la cabeza, con el pico en el tercio de afuera y
// afilandose hasta la cola. `lado` dice hacia donde queda el exterior.
function ceja(L, cx, cy, ancho, alto, lado) {
  for (let u = -1; u <= 1; u += .004) {          // -1 cabeza, +1 cola
    const x = cx + u * lado * ancho;
    const y = cy - Math.cos((u - .25) * 1.25) * alto + u * u * alto * .55;
    const grosor = Math.max(1.1, 2.1 * (1 - u * .85));
    for (let g = -grosor; g <= grosor; g += .5) set(L, x, y + g, pick(CEJA, x | 0, (y + g) | 0));
  }
}

// La almendra del ojo: exponente < 2 para que las esquinas queden en punta.
const dentro = (x, y, cx, cy, a, b) =>
  Math.pow(Math.abs((x - cx) / a), 1.5) + Math.pow(Math.abs((y - cy) / b), 1.5);

// La inclinacion levanta la esquina de afuera. Todo lo que toca el parpado
// trabaja en ese espacio inclinado; el iris no, porque es una esfera.
const inclina = (x, o) => (x - o.cx) * TILT * o.lado;

// Sombra de ojos: se abre hacia la esquina de afuera y se disuelve hacia arriba.
// Va antes que la ceja, para que la ceja la tape donde haga falta.
function sombraOjos(L, o) {
  const { cx, cy, a, b, lado } = o;
  for (let x = Math.floor(cx - a * 1.1); x <= cx + a * 1.1; x++) {
    const dx = (x - cx) / a;
    // Pegada al parpado: si sube mas, se come la cuenca y ensucia la ceja.
    const alto = b * (.30 + .40 * Math.max(0, dx * lado));
    const yTop = cy + bordeY(x - cx, a, b, true) - inclina(x, o);
    for (let s = 1; s <= alto; s++) {
      const y = Math.round(yTop - s);
      const umbral = (BAYER[((y % 4) + 4) % 4][((x % 4) + 4) % 4] + .5) / 16;
      if (s / alto > umbral * .85) continue;
      set(L, x, y, pick(SOMBRA_OJOS, x, y));
    }
  }
}

function ojoAbierto(L, o) {
  const { cx, cy, a, b, lado, ri, icx, icy } = o;

  for (let y = cy - b - 8; y <= cy + b + 8; y++)
    for (let x = cx - a - 8; x <= cx + a + 8; x++) {
      const yp = y + inclina(x, o);                  // coordenada del parpado
      const d = dentro(x, yp, cx, cy, a, b);

      if (d > 1) {                                   // fuera del ojo: delineado
        // El delineado engorda hacia la esquina de afuera.
        const haciaFuera = clamp((x - cx) * lado / a, 0, 1);
        if (d <= 1.30 + haciaFuera * .38 && yp <= cy + b * .35) set(L, x, y, pick(PESTANA, x, y));
        else if (d <= 1.14) set(L, x, y, pick(PESTANA, x, y));
        else if (d <= 1.5 && yp > cy) set(L, x, y, pick(PIEL_MEDIA, x, y));
        continue;
      }

      const prof = yp - (cy + bordeY(x - cx, a, b, true));   // hondura bajo el parpado
      const r = Math.hypot(x - icx, y - icy);

      if (r <= ri) {
        if (r <= ri * .40) { set(L, x, y, PUPILA_HONDA); continue; }
        if (r >= ri * .88) { set(L, x, y, IRIS_ANILLO); continue; }

        // Fibras radiales: el sector angular decide si la fibra es clara u
        // oscura. Pocas fibras y solo en la mitad de afuera: mas cerca de la
        // pupila los sectores miden menos de un pixel y solo dan ruido.
        const t = (r - ri * .40) / (ri * .48);       // 0 junto a la pupila, 1 al anillo
        const ang = Math.atan2(y - icy, x - icx);
        const sector = Math.floor((ang / (Math.PI * 2) + .5) * 12);
        let nivel = t < .12 ? 1 : t < .30 ? 2 : t < .62 ? 3 : t < .86 ? 2 : 1;
        if (t > .28) nivel += hash(sector) > .5 ? 1 : -1;
        if (prof < 4) nivel -= 2;                    // sombra del parpado
        else if (prof < 6) nivel -= 1;
        set(L, x, y, IRIS_RAMPA[clamp(Math.round(nivel), 0, 5)]);
        continue;
      }

      // Esclerotica: nunca plana. Sombra arriba y rincones mas calidos.
      let c = prof < 2.2 ? ESCLERA_HOND : prof < 4.2 ? ESCLERA_SOMB : ESCLERA_BASE;
      if (Math.abs(x - cx) > a * .74) c = ESCLERA_CALI;
      set(L, x, y, c);
    }

  // Linea de agua: el filo humedo del parpado de abajo.
  for (let x = cx - a * .58; x <= cx + a * .58; x++)
    set(L, x, cy + bordeY(x - cx, a, b, false) - inclina(x, o) - 1, LINEA_AGUA);

  // Rabillo: el trazo que se estira y sube en la esquina de afuera.
  const exX = cx + lado * a, exY = cy - a * TILT;
  const largoAla = a * .23;
  for (let s = -1; s < largoAla; s++) {
    const p = Math.max(0, s) / largoAla;
    const px = exX + lado * s * .92;
    const py = exY - s * .62 - p * p * a * .10;
    const gr = 1.7 * (1 - p * .95);
    for (let g = -gr; g <= gr; g += .5) set(L, px, py + g, pick(PESTANA, px | 0, (py + g) | 0));
  }

  // Lagrimal: el puntito claro de la esquina de adentro.
  const inX = cx - lado * a * .86, inY = cy + a * TILT * .86;
  set(L, inX, inY, LAGRIMAL);
  set(L, inX + lado, inY + 1, ESCLERA_CALI);

  // Destello principal y rebote opuesto: juntos leen como ojo humedo.
  const hx = icx - ri * .42, hy = icy - ri * .46;
  set(L, hx, hy, '#ffffff'); set(L, hx + 1, hy, '#ffffff');
  set(L, hx, hy + 1, '#ffffff'); set(L, hx + 1, hy + 1, '#f2e9e4');
  set(L, icx + ri * .40, icy + ri * .42, REBOTE);
  set(L, icx + ri * .40 + 1, icy + ri * .42, REBOTE);
}

// Pestanas: mas juntas y mas largas hacia la esquina de afuera, todas curvando
// hacia ese lado. Es lo que hace la mirada.
function pestanas(L, o, cerrado) {
  const { cx, cy, a, b, lado } = o;
  const N = 16;
  for (let k = 0; k < N; k++) {
    // La potencia agrupa las pestanas hacia el exterior.
    const tt = -.95 + 1.9 * Math.pow(k / (N - 1), .75);
    const t = tt * lado;
    const h = hash(k * 3.7 + cx);
    const bx = cx + t * a * .99;
    const by = cy + bordeY(t * a, a, b, true) - inclina(bx, o) + (cerrado ? b * .5 : 0);
    const largo = Math.min(7, (2.8 + 3.4 * (.5 + .5 * tt)) * (.82 + h * .45));
    for (let s = 0; s < largo; s++) {
      const p = s / largo;
      const px = bx + t * s * .55 + lado * p * p * largo * .42;
      const py = by - s * .95;
      set(L, px, py, pick(PESTANA, px | 0, py | 0));
      if (p < .45) set(L, px + lado, py, pick(PESTANA, px | 0, py | 0));
    }
  }

  if (cerrado) return;
  // Pestanas de abajo: cortas, solo en la mitad de afuera.
  for (let k = 0; k < 6; k++) {
    const tt = .12 + .76 * k / 5;
    const t = tt * lado;
    const bx = cx + t * a * .95;
    const by = cy + bordeY(t * a, a, b, false) - inclina(bx, o);
    const largo = 1.8 + 1.8 * (1 - Math.abs(tt - .45) * 1.5);
    for (let s = 0; s < largo; s++)
      set(L, bx + lado * s * .45, by + s * .9, pick(PESTANA, bx | 0, s));
  }
}

function ojo(L, o, cerrado) {
  if (cerrado) {
    // Parpado bajado: solo la linea de la pestana y su sombra.
    const { cx, cy, a, b } = o;
    for (let x = cx - a; x <= cx + a; x++) {
      const t = (x - cx) / a;
      const y = cy + Math.cos(t * 1.5) * b * .34 - inclina(x, o);
      for (let g = 0; g < 3; g++) set(L, x, y + g, pick(PESTANA, x | 0, g));
      set(L, x, y - 1, pick(PIEL_HONDA, x | 0, 1));
    }
  } else {
    ojoAbierto(L, o);
  }
  pestanas(L, o, cerrado);
}

function pintar(L, ctx) {
  ctx.clearRect(0, 0, W, H);
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++) {
      const c = L.px[y * W + x];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(x, y, 1, 1);
    }
}

// Los centros van separados casi un ancho de ojo, como en un rostro de verdad.
// Guardo la geometria del iris porque los reflejos la necesitan.
// `lado` apunta hacia la esquina de afuera de cada ojo.
const OJOS = [
  { cx: 46,  cy: 52, a: 19, b: 10.5, lado: -1 },
  { cx: 122, cy: 48, a: 22, b: 12,   lado:  1 }   // el protagonista, un poco mas grande
];
OJOS.forEach(o => { o.ri = o.b * 1.12; o.icx = o.cx; o.icy = o.cy - o.b * .10; });

function retrato(cerrado) {
  const L = nuevoLienzo();
  // Primero la piel, luego la sombra, luego la ceja: cada capa tapa a la anterior.
  parche(L, 46, 52, 30, 27);
  parche(L, 122, 48, 34, 30);
  OJOS.forEach(o => sombraOjos(L, o));
  ceja(L, 46, 33, 23, 7.5, -1);
  ceja(L, 122, 27, 28, 8.5, 1);
  OJOS.forEach(o => ojo(L, o, cerrado));
  return L;
}

function dibujarOjos() {
  pintar(retrato(false), $('abiertos').getContext('2d'));
  pintar(retrato(true),  $('cerrados').getContext('2d'));
}

/* ==========================================================
   2b. La cancion: renglones que suben y se van encendiendo
   ========================================================== */
const APAGADO = '#6f6a9c', APAGADO_S = '#171334';
const ENCENDIDO = '#ffe9a3', ENCENDIDO_S = '#5a3410';

const contLetra = $('letra');
const renglones = LETRA.map(({ t }) => {
  const div = document.createElement('div');
  div.className = 'linea';
  if (t) {
    div.innerHTML = `<div class="par">`
                  +   `<div class="capa apagada">${pixelText(t, APAGADO, APAGADO_S)}</div>`
                  +   `<div class="capa encendida">${pixelText(t, ENCENDIDO, ENCENDIDO_S)}</div>`
                  + `</div>`;
  }
  contLetra.appendChild(div);
  return div;
});

// El renglon mas largo manda: de ahi sale el tamano de pixel que cabe.
const MAS_LARGO = Math.max(...LETRA.map(l => l.t.length), 1);
function medirLetra() {
  // El ancho disponible ya descuenta a los bailarines, porque se mide la ventana.
  // Ancho de un renglon = caracteres * AVANCE * (alto / CAJA). Se despeja el alto.
  const disponible = ($('ventana').clientWidth || innerWidth * .7) * .97;
  const cabeAncho = disponible / (MAS_LARGO * AVANCE / CAJA);
  const cabeAlto  = (innerHeight * .34) / (3 * 1.75);   // el bloque ocupa ~34% del alto
  const alto = Math.max(13, Math.min(48, cabeAncho, cabeAlto));
  const raiz = document.documentElement.style;
  raiz.setProperty('--alto-texto', alto + 'px');
  raiz.setProperty('--alto-linea', Math.round(alto * 1.75) + 'px');
  return Math.round(alto * 1.75);
}
let altoRenglon = medirLetra();

let renglonActual = -1;
function colocarLetra(i) {
  contLetra.style.transform = `translateY(${-i * altoRenglon}px)`;
  renglones.forEach((el, k) => {
    const d = Math.abs(k - i);
    el.style.opacity = d === 0 ? 1 : d === 1 ? .34 : 0;
    el.classList.toggle('activa', k === i);
  });
}

const INICIOS = [];
let totalLetra = 0;
LETRA.forEach(l => { INICIOS.push(totalLetra); totalLetra += l.d; });

let t0 = performance.now();

function actualizarLetra(ahora) {
  let t = (ahora - t0) / 1000;
  if (t >= totalLetra) { t0 = ahora; t = 0; }           // vuelve a empezar

  let i = 0;
  while (i < LETRA.length - 1 && t >= INICIOS[i + 1]) i++;
  if (i !== renglonActual) { renglonActual = i; colocarLetra(i); }

  const p = Math.min(1, (t - INICIOS[i]) / LETRA[i].d);
  renglones.forEach((el, k) => {
    const luz = el.querySelector('.encendida');
    if (!luz) return;
    const q = k < i ? 1 : k > i ? 0 : p;
    luz.style.clipPath = `inset(0 ${(1 - q) * 100}% 0 0)`;
  });
}

addEventListener('resize', () => {
  altoRenglon = medirLetra();
  if (renglonActual >= 0) colocarLetra(renglonActual);
});

/* ==========================================================
   2c. La pareja que baila a los lados de la letra
   ----------------------------------------------------------
   Los cuerpos se arman por partes (piernas, torso, brazos,
   cabeza) sobre una rejilla de 26x36. Una "pose" es donde van
   los codos, manos, rodillas y pies; alternando tres poses se
   ve el baile. La chica es el mismo dibujo pero en espejo.
   ========================================================== */
const ANCHO_B = 26, ALTO_B = 36;

const PIEL_CH   = ['#c8a083', '#bd9576', '#d2aa8d'];
const PIEL_CA   = ['#d9b298', '#cda48a', '#e2bda3'];
const PELO_CH   = ['#332417', '#281c12', '#3d2c1c'];
const PELO_CA   = ['#4a2c18', '#3b2212', '#57351e'];
const CAMISA    = ['#e4e9f6', '#d2d9ec', '#f0f4ff'];   // blanca, atrapa la luna
const PANTALON  = ['#2b3a5e', '#22304e', '#33456c'];
const VESTIDO   = ['#b04a6e', '#9c3e60', '#c25a80'];
const ZAPATO    = ['#1b1510', '#241d15'];
const OJITO     = '#241a12';
const BOCA      = '#8a5a4a';
const CONTORNO_B = '#0f0c14';

const lienzoB = () => new Array(ANCHO_B * ALTO_B).fill(null);
const ponB = (L, x, y, c) => {
  x = Math.round(x); y = Math.round(y);
  if (x >= 0 && x < ANCHO_B && y >= 0 && y < ALTO_B && c) L[y * ANCHO_B + x] = c;
};

const aclarar = (hex, f) => {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map(v => Math.min(255, Math.round(v + (255 - v) * f)).toString(16).padStart(2, '0'))
    .join('');
};

function lineaB(L, x0, y0, x1, y1, grosor, color) {
  const pasos = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2) + 1;
  const r = (grosor - 1) / 2;
  for (let i = 0; i <= pasos; i++) {
    const t = i / pasos, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
    for (let gy = -r; gy <= r; gy += .5)
      for (let gx = -r; gx <= r; gx += .5)
        ponB(L, x + gx, y + gy, pick(color, x + gx, y + gy));
  }
}
function elipseB(L, cx, cy, rx, ry, color) {
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++)
    for (let x = Math.floor(cx - rx); x <= cx + rx; x++)
      if (Math.hypot((x - cx) / rx, (y - cy) / ry) <= 1) ponB(L, x, y, pick(color, x, y));
}
function trapecioB(L, y0, y1, w0, w1, cx0, cx1, color) {
  for (let y = y0; y <= y1; y++) {
    const t = (y - y0) / Math.max(1, y1 - y0);
    const w = w0 + (w1 - w0) * t, cx = cx0 + (cx1 - cx0) * t;
    for (let x = Math.round(cx - w / 2); x <= Math.round(cx + w / 2); x++)
      ponB(L, x, y, pick(color, x, y));
  }
}

// La mano de adentro (la de la derecha del dibujo) se queda casi quieta a la
// altura del hombro: es la que va tomada con la de la pareja, porque la chica
// se dibuja en espejo. El baile lo hacen el otro brazo y las piernas.
const POSES = [
  { codoI: [7, 16],  manoI: [4, 12],  codoD: [20, 13], manoD: [24, 12],
    rodI: [11, 26],  pieI: [9, 32],   rodD: [16, 26],  pieD: [19, 32],  sesgo: -1.1 },
  { codoI: [6, 17],  manoI: [3, 20],  codoD: [20, 14], manoD: [24, 12],
    rodI: [12, 26],  pieI: [12, 32],  rodD: [15, 26],  pieD: [15, 32],  sesgo: 0 },
  { codoI: [7, 14],  manoI: [5, 9],   codoD: [20, 12], manoD: [24, 11],
    rodI: [10, 26],  pieI: [8, 32],   rodD: [16, 27],  pieD: [18, 31],  sesgo: 1.1 }
];

function armarBailarin(pose, esChica) {
  const L = lienzoB();
  const piel = esChica ? PIEL_CA : PIEL_CH;
  const pelo = esChica ? PELO_CA : PELO_CH;
  const ropa = esChica ? VESTIDO : CAMISA;
  const h = pose.sesgo;                       // el cuerpo se ladea con el paso
  const cx = 13 + h * .7;                     // centro de la cabeza

  // 1. La melena de la chica va detras de todo
  if (esChica) trapecioB(L, 4, 18, 8, 13, cx, cx - h * .8, pelo);

  // 2. Piernas y zapatos
  const pierna = esChica ? piel : PANTALON;
  [['rodI', 'pieI', 12], ['rodD', 'pieD', 14]].forEach(([rod, pie, xCadera]) => {
    lineaB(L, xCadera + h, 21, pose[rod][0], pose[rod][1], 3, pierna);
    lineaB(L, pose[rod][0], pose[rod][1], pose[pie][0], pose[pie][1], 3, pierna);
    lineaB(L, pose[pie][0] - 1, pose[pie][1] + 1, pose[pie][0] + 1, pose[pie][1] + 1, 2, ZAPATO);
  });

  // 3. Torso: camisa y pantalon, o corpino y falda que vuela
  if (esChica) {
    trapecioB(L, 11, 16, 8, 6, 13, 13 + h * .5, ropa);
    trapecioB(L, 16, 26, 6, 17, 13 + h * .5, 13 + h * 2.2, ropa);
  } else {
    trapecioB(L, 11, 20, 9, 7, 13, 13 + h * .5, ropa);
    trapecioB(L, 20, 22, 7, 7, 13 + h * .5, 13 + h, PANTALON);
  }

  // 4. Brazos: manga de la ropa y antebrazo de piel
  [['codoI', 'manoI', 9], ['codoD', 'manoD', 17]].forEach(([codo, mano, xHombro]) => {
    lineaB(L, xHombro, 12, pose[codo][0], pose[codo][1], 3, ropa);
    lineaB(L, pose[codo][0], pose[codo][1], pose[mano][0], pose[mano][1], 2, piel);
    elipseB(L, pose[mano][0], pose[mano][1], 1.1, 1.1, piel);
  });

  // 5. Cuello, cabeza y pelo
  lineaB(L, 13 + h * .4, 10, 13 + h * .4, 12, 3, piel);
  elipseB(L, cx, 6, 4.2, 4.6, piel);
  for (let y = 1; y <= 4; y++)                // casquete: solo la coronilla
    for (let x = -5; x <= 5; x++)
      if (Math.hypot(x / 4.6, (y - 6) / 5.2) <= 1) ponB(L, cx + x, y, pick(pelo, cx + x, y));
  if (esChica) {                              // fleco ladeado sobre la frente
    lineaB(L, cx - 3, 3, cx + 1, 4, 2, pelo);
  }

  // 6. Cara
  ponB(L, cx - 2, 6, OJITO); ponB(L, cx + 2, 6, OJITO);
  ponB(L, cx - 1, 8, BOCA); ponB(L, cx, 8, BOCA); ponB(L, cx + 1, 8, BOCA);

  // 7. La luna pega arriba y a la izquierda: ese canto se aclara
  const copia = L.slice();
  for (let y = 0; y < ALTO_B; y++)
    for (let x = 0; x < ANCHO_B; x++) {
      const c = copia[y * ANCHO_B + x];
      if (!c) continue;
      const izq = x === 0 ? null : copia[y * ANCHO_B + x - 1];
      const arr = y === 0 ? null : copia[(y - 1) * ANCHO_B + x];
      if (!izq || !arr) L[y * ANCHO_B + x] = aclarar(c, .34);
    }

  // 8. Contorno oscuro, para que se despeguen de la noche
  const conLuz = L.slice();
  const lleno = (x, y) => x >= 0 && x < ANCHO_B && y >= 0 && y < ALTO_B && conLuz[y * ANCHO_B + x];
  for (let y = 0; y < ALTO_B; y++)
    for (let x = 0; x < ANCHO_B; x++) {
      if (conLuz[y * ANCHO_B + x]) continue;
      if (lleno(x - 1, y) || lleno(x + 1, y) || lleno(x, y - 1) || lleno(x, y + 1))
        L[y * ANCHO_B + x] = CONTORNO_B;
    }
  return L;
}

function bailarinURL(L) {
  let out = '';
  for (let y = 0; y < ALTO_B; y++)
    for (let x = 0; x < ANCHO_B; x++) {
      const c = L[y * ANCHO_B + x];
      if (c) out += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
    }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${ANCHO_B} ${ALTO_B}" `
            + `shape-rendering="crispEdges">${out}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

const CUADROS_CHICO = POSES.map(p => bailarinURL(armarBailarin(p, false)));
const CUADROS_CHICA = POSES.map(p => bailarinURL(armarBailarin(p, true)));

let cuadroB = 0;
function pasoDeBaile() {
  // El mismo cuadro para los dos: asi las manos tomadas quedan a la misma
  // altura y el paso se ve acompasado, como debe bailar una pareja.
  $('chico').style.backgroundImage = CUADROS_CHICO[cuadroB];
  $('chica').style.backgroundImage = CUADROS_CHICA[cuadroB];
  cuadroB = (cuadroB + 1) % POSES.length;
}
pasoDeBaile();
setInterval(pasoDeBaile, 320);

// Parpadeo cada tanto
setInterval(() => {
  $('retrato').classList.add('parpadeo');
  setTimeout(() => $('retrato').classList.remove('parpadeo'), 140);
}, 4200);

/* ==========================================================
   3. Cielo, suelo y luciernagas
   ========================================================== */
const cielo = $('cielo');
for (let i = 0; i < 140; i++) {
  const s = document.createElement('div');
  s.className = 'estrella';
  const t = Math.random() < .82 ? 2 : 3;
  s.style.width = t + 'px';
  s.style.height = t + 'px';
  s.style.left = rnd(0, 100) + '%';
  s.style.top = rnd(0, 78) + '%';
  s.style.opacity = rnd(.2, 1);
  s.style.animationDuration = rnd(1.6, 5) + 's';
  s.style.animationDelay = -rnd(0, 5) + 's';
  cielo.appendChild(s);
}

const luces = $('luces');
function luciernaga(x, y) {
  const l = document.createElement('div');
  l.className = 'luci';
  l.style.left = (x ?? rnd(0, 99)) + '%';
  l.style.top = (y ?? rnd(20, 92)) + '%';
  l.style.setProperty('--dx', rnd(-90, 90) + 'px');
  l.style.setProperty('--dy', rnd(-70, 40) + 'px');
  l.style.animationDuration = rnd(5, 12) + 's, ' + rnd(1.4, 3.6) + 's';
  l.style.animationDelay = -rnd(0, 6) + 's, ' + -rnd(0, 4) + 's';
  const t = rnd(3, 6) | 0;
  l.style.width = t + 'px'; l.style.height = t + 'px';
  luces.appendChild(l);
}
for (let i = 0; i < 55; i++) luciernaga();

// Luna y suelo, dibujados como sprites de pixeles
function spriteSVG(rows, palette) {
  const h = rows.length, w = rows[0].length;
  let out = '';
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const p = palette[rows[y][x]];
      if (!p) continue;
      out += `<rect x="${x}" y="${y}" width="1" height="1" fill="${Array.isArray(p) ? pick(p, x, y) : p}"/>`;
    }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" `
       + `preserveAspectRatio="xMidYMax meet">${out}</svg>`;
}

document.querySelector('.luna').innerHTML =

function sueloTile() {
  let r = '';
  for (let y = 0; y < 32; y++)
    for (let x = 0; x < 16; x++) {
      const c = y < 4 ? pick(NOCHE_PASTO, x, y)
              : y < 18 ? pick(NOCHE_TIERRA, x, y)
              : pick(NOCHE_PIEDRA, x, y);
      r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
    }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 32" preserveAspectRatio="none">${r}</svg>`;
}

/* --- Reflejos de las luciernagas dentro del iris ---
   Las posiciones salen de las luciernagas de verdad: se lee donde esta cada
   una en la pantalla y se comprime la escena dentro del disco del iris,
   invertida, como en cualquier reflejo. El titileo lleva su propio ritmo. */
const REFLEJADAS = [...luces.children].slice(0, 10);
const ctxRef = $('reflejos').getContext('2d');
let ultimoRef = 0;

function bucle(ahora) {
  requestAnimationFrame(bucle);
  actualizarLetra(ahora);                                // la letra, cuadro a cuadro
  if (ahora - ultimoRef < 55) return;                    // los reflejos, ~18 por segundo
  ultimoRef = ahora;
  ctxRef.clearRect(0, 0, W, H);
  const t = ahora / 1000;

  REFLEJADAS.forEach((el, i) => {
    const brillo = .5 + .5 * Math.sin(t * (.9 + hash(i)) + hash(i + 9) * 6.28);
    if (brillo < .45) return;
    const r = el.getBoundingClientRect();
    const u = (r.left + r.width / 2) / innerWidth - .5;
    const v = (r.top + r.height / 2) / innerHeight - .5;

    OJOS.forEach(o => {
      const x = Math.round(o.icx - u * o.ri * 1.5);      // el reflejo va en espejo
      const y = Math.round(o.icy + v * o.ri * 1.5);
      if (Math.hypot(x - o.icx, y - o.icy) > o.ri * .80) return;
      // Calido, casi blanco: tiene que leerse como luz, no como mancha verde.
      ctxRef.fillStyle = '#fff7c4';
      ctxRef.globalAlpha = .35 + brillo * .5;
      ctxRef.fillRect(x, y, 1, 1);
      ctxRef.globalAlpha *= .22;                          // halo de un pixel
      ctxRef.fillRect(x - 1, y, 1, 1); ctxRef.fillRect(x + 1, y, 1, 1);
      ctxRef.fillRect(x, y - 1, 1, 1); ctxRef.fillRect(x, y + 1, 1, 1);
    });
  });
  ctxRef.globalAlpha = 1;
}

dibujarOjos();
colocarLetra(0);
requestAnimationFrame(bucle);

document.addEventListener('pointerdown', e => {

  for (let i = 0; i < 3; i++)
    luciernaga(e.clientX / innerWidth * 100, e.clientY / innerHeight * 100);
});
